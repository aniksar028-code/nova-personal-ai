<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#090B0C"
  >

  <meta
    name="description"
    content="NOVA — Your Second Mind"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>NOVA — Your Second Mind</title>

  <style>

    :root {
      --bg: #090B0C;
      --surface: #111416;
      --surface-2: #171B1D;
      --border: rgba(255,255,255,.08);
      --text: #F3F5F2;
      --muted: #89918D;
      --accent: #C8FF4A;
      --accent-soft: rgba(200,255,74,.10);
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(200,255,74,.08),
          transparent 32%
        ),
        var(--bg);
      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .app {
      width: 100%;
      max-width: 680px;
      min-height: 100vh;
      margin: auto;
      padding: 22px 18px 125px;
    }

    /* =========================
       TOP BAR
    ========================== */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;

      border-radius: 11px;

      display: grid;
      place-items: center;

      background: var(--accent);
      color: #090B0C;

      font-size: 17px;
      font-weight: 900;

      box-shadow:
        0 0 25px rgba(200,255,74,.16);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .profile {
      width: 38px;
      height: 38px;

      border-radius: 50%;
      border: 1px solid var(--border);

      background: var(--surface);

      display: grid;
      place-items: center;

      color: var(--muted);
      font-size: 14px;

      transition: .2s ease;
    }

    .profile:active {
      transform: scale(.94);
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      margin-top: 48px;
    }

    .eyebrow {
      color: var(--accent);

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 2px;
      text-transform: uppercase;

      margin-bottom: 12px;
    }

    .hero h1 {
      max-width: 500px;

      font-size: clamp(36px, 10vw, 62px);
      line-height: .98;

      letter-spacing: -2.5px;
    }

    .hero p {
      margin-top: 16px;

      color: var(--muted);
      font-size: 15px;
    }

    /* =========================
       ORB
    ========================== */

    .orb-area {
      display: flex;
      justify-content: center;

      margin: 35px 0 25px;
    }

    .orb {
      position: relative;

      width: 105px;
      height: 105px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at 35% 30%,
          #eaffbd,
          var(--accent) 35%,
          #7ea52d 70%,
          #273114
        );

      box-shadow:
        0 0 40px rgba(200,255,74,.14),
        inset 0 0 25px rgba(255,255,255,.25);

      animation: float 4s ease-in-out infinite;
    }

    .orb::before,
    .orb::after {
      content: "";

      position: absolute;

      inset: -12px;

      border:
        1px solid rgba(200,255,74,.12);

      border-radius: 50%;

      animation:
        pulse 3s ease-in-out infinite;
    }

    .orb::after {
      inset: -22px;

      opacity: .45;

      animation-delay: 1s;
    }

    .orb-core {
      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: #090B0C;

      box-shadow:
        0 0 18px rgba(255,255,255,.3);
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes pulse {
      0%,100% {
        transform: scale(.96);
        opacity: .25;
      }

      50% {
        transform: scale(1.04);
        opacity: .7;
      }
    }

    /* =========================
       COMPOSER
    ========================== */

    .composer {
      background:
        rgba(17,20,22,.88);

      border:
        1px solid var(--border);

      border-radius: 24px;

      padding: 17px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.22);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .composer textarea {
      width: 100%;

      min-height: 72px;
      max-height: 180px;

      resize: none;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text);

      font-size: 16px;
      line-height: 1.5;
    }

    .composer textarea::placeholder {
      color: #626A66;
    }

    .composer-bottom {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-top: 8px;
    }

    .voice-btn {
      width: 43px;
      height: 43px;

      border-radius: 14px;

      border:
        1px solid var(--border);

      background:
        var(--surface-2);

      color: var(--text);

      font-size: 17px;

      transition: .2s ease;
    }

    .voice-btn:active {
      transform: scale(.94);
    }

    .send-btn {
      height: 43px;

      padding: 0 19px;

      border: 0;

      border-radius: 14px;

      background:
        var(--accent);

      color: #090B0C;

      font-size: 13px;
      font-weight: 800;

      transition: .2s ease;
    }

    .send-btn:active {
      transform: scale(.96);
    }

    /* =========================
       NOVA REPLY
    ========================== */

    .nova-reply {
      margin-top: 16px;

      padding: 18px;

      border:
        1px solid rgba(200,255,74,.18);

      border-radius: 20px;

      background:
        rgba(200,255,74,.04);

      color: var(--text);

      font-size: 15px;
      line-height: 1.65;

      white-space: pre-wrap;

      animation:
        replyIn .25s ease;
    }

    .nova-reply-label {
      color: var(--accent);

      font-size: 10px;
      font-weight: 900;

      letter-spacing: 2px;

      margin-bottom: 10px;
    }

    .nova-reply-text {
      color: var(--text);
    }

    @keyframes replyIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       MODE
    ========================== */

    .section {
      margin-top: 30px;
    }

    .section-title {
      color: var(--muted);

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 1.8px;
      text-transform: uppercase;

      margin-bottom: 12px;
    }

    .modes {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;
    }

    .mode {
      text-align: left;

      padding: 16px 13px;

      border-radius: 17px;

      border:
        1px solid var(--border);

      background:
        var(--surface);

      color:
        var(--text);

      transition:
        .2s ease;
    }

    .mode:active {
      transform: scale(.97);
    }

    .mode.active {
      border-color:
        rgba(200,255,74,.4);

      background:
        var(--accent-soft);

      box-shadow:
        0 0 25px rgba(200,255,74,.04);
    }

    .mode-icon {
      font-size: 17px;
      margin-bottom: 12px;
    }

    .mode strong {
      display: block;
      font-size: 13px;
    }

    .mode span {
      display: block;

      color: var(--muted);

      font-size: 10px;

      margin-top: 5px;
    }

    /* =========================
       QUICK ACTIONS
    ========================== */

    .quick-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 9px;
    }

    .quick {
      padding: 16px;

      border-radius: 17px;

      border:
        1px solid var(--border);

      background:
        var(--surface);

      color:
        var(--text);

      text-align: left;

      transition: .2s ease;
    }

    .quick:active {
      transform: scale(.97);
    }

    .quick small {
      display: block;

      color:
        var(--muted);

      margin-top: 6px;

      font-size: 11px;
    }

    /* =========================
       TODAY
    ========================== */

    .today {
      border:
        1px solid var(--border);

      border-radius: 20px;

      overflow: hidden;

      background:
        var(--surface);
    }

    .task {
      display: flex;

      align-items: center;

      gap: 13px;

      padding: 16px;

      border-bottom:
        1px solid var(--border);

      transition: .2s ease;
    }

    .task:last-child {
      border-bottom: 0;
    }

    .task.done {
      opacity: .62;
    }

    .task-time {
      width: 45px;

      color:
        var(--muted);

      font-size: 11px;
    }

    .check {
      width: 23px;
      height: 23px;

      border-radius: 8px;

      border:
        1px solid #39403D;

      background:
        transparent;

      color:
        transparent;

      display: grid;
      place-items: center;

      font-size: 12px;

      transition: .2s ease;
    }

    .task.done .check {
      background:
        var(--accent);

      color:
        #090B0C;

      border-color:
        var(--accent);
    }

    .task-info {
      flex: 1;
    }

    .task-info strong {
      display: block;

      font-size: 13px;
    }

    .task-info span {
      display: block;

      color:
        var(--muted);

      font-size: 10px;

      margin-top: 4px;
    }

    /* =========================
       STATUS
    ========================== */

    .status {
      text-align: center;

      margin-top: 22px;

      color:
        #69716D;

      font-size: 11px;

      min-height: 16px;
    }

    /* =========================
       BOTTOM NAV
    ========================== */

    .bottom-nav {
      position: fixed;

      left: 50%;
      bottom: 15px;

      transform:
        translateX(-50%);

      width:
        min(92%, 560px);

      padding: 8px;

      border:
        1px solid var(--border);

      border-radius: 21px;

      background:
        rgba(17,20,22,.92);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      box-shadow:
        0 15px 40px rgba(0,0,0,.35);

      z-index: 50;
    }

    .nav-btn {
      border: 0;

      background:
        transparent;

      color:
        var(--muted);

      border-radius: 15px;

      padding:
        10px 4px;

      font-size: 10px;

      transition:
        .2s ease;
    }

    .nav-btn span {
      display: block;

      font-size: 15px;

      margin-bottom: 3px;
    }

    .nav-btn.active {
      background:
        var(--accent-soft);

      color:
        var(--accent);
    }

    /* =========================
       TOAST
    ========================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 88px;

      transform:
        translate(-50%, 20px);

      background:
        #F3F5F2;

      color:
        #090B0C;

      padding:
        11px 17px;

      border-radius: 13px;

      font-size: 12px;
      font-weight: 700;

      opacity: 0;

      pointer-events: none;

      transition:
        .25s ease;

      z-index: 100;

      white-space: nowrap;

      max-width: 90vw;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 390px) {

      .hero h1 {
        font-size: 35px;
      }

      .orb {
        width: 90px;
        height: 90px;
      }

      .mode {
        padding:
          14px 11px;
      }

      .quick {
        padding:
          14px;
      }
    }

  </style>
</head>

<body>

  <main class="app">

    <!-- =====================
         TOP BAR
    ====================== -->

    <header class="topbar">

      <div class="brand">

        <div class="brand-mark">
          N
        </div>

        <div class="brand-name">
          NOVA
        </div>

      </div>

      <button
        class="profile"
        onclick="showToast('Profile will open in the next NOVA update.')"
        aria-label="Profile"
      >
        A
      </button>

    </header>


    <!-- =====================
         HERO
    ====================== -->

    <section class="hero">

      <div class="eyebrow">
        Your Second Mind
      </div>

      <h1>
        What should we do?
      </h1>

      <p>
        Think. Learn. Do.
      </p>

    </section>


    <!-- =====================
         NOVA ORB
    ====================== -->

    <div class="orb-area">

      <div class="orb">

        <div class="orb-core"></div>

      </div>

    </div>


    <!-- =====================
         AI COMPOSER
    ====================== -->

    <section class="composer">

      <textarea
        id="prompt"
        placeholder="Ask NOVA anything..."
        oninput="autoResize(this)"
        autocomplete="off"
        spellcheck="true"
      ></textarea>

      <div class="composer-bottom">

        <button
          class="voice-btn"
          onclick="startVoice()"
          aria-label="Voice input"
        >
          🎙
        </button>

        <button
          class="send-btn"
          onclick="askNova()"
          id="sendButton"
        >
          Ask NOVA →
        </button>

      </div>

    </section>


    <!-- =====================
         MODE
    ====================== -->

    <section class="section">

      <div class="section-title">
        Mode
      </div>

      <div class="modes">

        <button
          class="mode active"
          id="askMode"
          onclick="setMode('ASK')"
        >

          <div class="mode-icon">
            ◉
          </div>

          <strong>
            ASK
          </strong>

          <span>
            Know anything
          </span>

        </button>


        <button
          class="mode"
          id="learnMode"
          onclick="setMode('LEARN')"
        >

          <div class="mode-icon">
            ◇
          </div>

          <strong>
            LEARN
          </strong>

          <span>
            Learn anything
          </span>

        </button>


        <button
          class="mode"
          id="doMode"
          onclick="setMode('DO')"
        >

          <div class="mode-icon">
            →
          </div>

          <strong>
            DO
          </strong>

          <span>
            Get things done
          </span>

        </button>

      </div>

    </section>


    <!-- =====================
         QUICK ACTIONS
    ====================== -->

    <section class="section">

      <div class="section-title">
        Quick Actions
      </div>

      <div class="quick-grid">

        <button
          class="quick"
          onclick="quickAction('Create a practical plan for today')"
        >
          ✦ Plan my day

          <small>
            Organize your priorities
          </small>

        </button>


        <button
          class="quick"
          onclick="quickAction('Teach me something useful in a simple way')"
        >
          ◇ Teach me

          <small>
            Start a learning session
          </small>

        </button>


        <button
          class="quick"
          onclick="quickAction('Show me my tasks and help me prioritize them')"
        >
          ✓ My tasks

          <small>
            See what needs doing
          </small>

        </button>


        <button
          class="quick"
          onclick="quickAction('Help me think through an idea clearly')"
        >
          ◎ Think with me

          <small>
            Work through an idea
          </small>

        </button>

      </div>

    </section>


    <!-- =====================
         TODAY
    ====================== -->

    <section class="section">

      <div class="section-title">
        Today
      </div>

      <div class="today">

        <div
          class="task"
          id="task1"
        >

          <div class="task-time">
            09:00
          </div>

          <button
            class="check"
            onclick="toggleTask('task1')"
            aria-label="Complete study session"
          >
            ✓
          </button>

          <div class="task-info">

            <strong>
              Study session
            </strong>

            <span>
              Focus block
            </span>

          </div>

        </div>


        <div
          class="task"
          id="task2"
        >

          <div class="task-time">
            17:00
          </div>

          <button
            class="check"
            onclick="toggleTask('task2')"
            aria-label="Complete workout"
          >
            ✓
          </button>

          <div class="task-info">

            <strong>
              Workout
            </strong>

            <span>
              Move your body
            </span>

          </div>

        </div>


        <div
          class="task"
          id="task3"
        >

          <div class="task-time">
            21:00
          </div>

          <button
            class="check"
            onclick="toggleTask('task3')"
            aria-label="Complete revision"
          >
            ✓
          </button>

          <div class="task-info">

            <strong>
              Revision
            </strong>

            <span>
              Review today's learning
            </span>

          </div>

        </div>

      </div>

    </section>


    <!-- =====================
         STATUS
    ====================== -->

    <div
      class="status"
      id="status"
    >
      NOVA is ready.
    </div>

  </main>


  <!-- =====================
       BOTTOM NAV
  ====================== -->

  <nav class="bottom-nav">

    <button
      class="nav-btn active"
      onclick="navClick('Home', this)"
    >
      <span>⌂</span>
      Home
    </button>


    <button
      class="nav-btn"
      onclick="navClick('Mind', this)"
    >
      <span>◉</span>
      Mind
    </button>


    <button
      class="nav-btn"
      onclick="navClick('Learn', this)"
    >
      <span>◇</span>
      Learn
    </button>


    <button
      class="nav-btn"
      onclick="navClick('Activity', this)"
    >
      <span>≡</span>
      Activity
    </button>

  </nav>


  <!-- =====================
       TOAST
  ====================== -->

  <div
    class="toast"
    id="toast"
  ></div>


  <!-- =====================
       NOVA AI ENGINE
  ====================== -->

  <script src="app.js"></script>


  <script>

    /* =========================================
       NOVA UI STATE
    ========================================== */

    let currentMode =
      localStorage.getItem("nova_mode") || "ASK";


    /* =========================================
       MODE
    ========================================== */

    function setMode(mode) {

      currentMode = mode;

      /*
        IMPORTANT:
        Sync UI mode with app.js NOVA engine.
      */

      if (
        window.NOVA &&
        typeof window.NOVA.setMode === "function"
      ) {
        NOVA.setMode(mode);
      }

      document
        .querySelectorAll(".mode")
        .forEach(button => {
          button.classList.remove("active");
        });


      if (mode === "ASK") {

        document
          .getElementById("askMode")
          .classList.add("active");

      }


      if (mode === "LEARN") {

        document
          .getElementById("learnMode")
          .classList.add("active");

      }


      if (mode === "DO") {

        document
          .getElementById("doMode")
          .classList.add("active");

      }


      document
        .getElementById("status")
        .innerText =
          mode + " mode • NOVA is ready.";


      showToast(
        mode + " mode selected"
      );

    }


    /* =========================================
       ASK NOVA
    ========================================== */

    async function askNova() {

      const input =
        document.getElementById("prompt");

      const button =
        document.getElementById("sendButton");

      const text =
        input.value.trim();


      if (!text) {

        showToast(
          "Tell NOVA what you need."
        );

        input.focus();

        return;
      }


      /*
        Make sure the current UI mode
        is synced with NOVA.
      */

      if (
        window.NOVA &&
        typeof window.NOVA.setMode === "function"
      ) {
        NOVA.setMode(currentMode);
      }


      button.disabled = true;

      button.innerText =
        "Thinking...";


      document
        .getElementById("status")
        .innerText =
          "NOVA is thinking...";


      showToast(
        "NOVA is thinking..."
      );


      try {

        if (
          !window.NOVA ||
          typeof window.NOVA.ask !== "function"
        ) {

          throw new Error(
            "NOVA AI engine is not loaded."
          );

        }


        const result =
          await NOVA.ask(text);


        if (result.success) {

          input.value = "";

          autoResize(input);


          document
            .getElementById("status")
            .innerText =
              "NOVA replied.";


          showNovaReply(
            result.message
          );

        } else {

          document
            .getElementById("status")
            .innerText =
              "NOVA couldn't answer.";


          showToast(
            result.message ||
            "Something went wrong."
          );

        }

      } catch (error) {

        console.error(
          "NOVA ERROR:",
          error
        );


        document
          .getElementById("status")
          .innerText =
            "Connection error.";


        showToast(
          "NOVA could not connect."
        );

      } finally {

        button.disabled = false;

        button.innerText =
          "Ask NOVA →";

      }

    }


    /* =========================================
       SHOW AI RESPONSE
    ========================================== */

    function showNovaReply(message) {

      const oldReply =
        document.getElementById(
          "novaReply"
        );


      if (oldReply) {
        oldReply.remove();
      }


      const reply =
        document.createElement("div");


      reply.id =
        "novaReply";


      reply.className =
        "nova-reply";


      const label =
        document.createElement("div");


      label.className =
        "nova-reply-label";


      label.innerText =
        "NOVA";


      const answer =
        document.createElement("div");


      answer.className =
        "nova-reply-text";


      answer.textContent =
        message || "NOVA could not answer.";


      reply.appendChild(label);

      reply.appendChild(answer);


      const composer =
        document.querySelector(
          ".composer"
        );


      if (composer) {

        composer.insertAdjacentElement(
          "afterend",
          reply
        );

      }


      setTimeout(() => {

        reply.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      }, 50);

    }


    /* =========================================
       QUICK ACTIONS
    ========================================== */

    function quickAction(text) {

      const input =
        document.getElementById(
          "prompt"
        );


      input.value = text;

      input.focus();


      autoResize(input);


      showToast(
        "Ready to send"
      );

    }


    /* =========================================
       TASK TOGGLE
    ========================================== */

    function toggleTask(id) {

      const task =
        document.getElementById(id);


      if (!task) {
        return;
      }


      task.classList.toggle(
        "done"
      );


      saveTasks();


      if (
        task.classList.contains(
          "done"
        )
      ) {

        showToast(
          "Nice. Task completed."
        );

      } else {

        showToast(
          "Task reopened."
        );

      }

    }


    /* =========================================
       SAVE TASKS
    ========================================== */

    function saveTasks() {

      const tasks = {};


      [
        "task1",
        "task2",
        "task3"
      ].forEach(id => {

        const element =
          document.getElementById(id);


        if (element) {

          tasks[id] =
            element.classList.contains(
              "done"
            );

        }

      });


      localStorage.setItem(
        "nova_tasks",
        JSON.stringify(tasks)
      );

    }


    /* =========================================
       LOAD TASKS
    ========================================== */

    function loadTasks() {

      const saved =
        localStorage.getItem(
          "nova_tasks"
        );


      if (!saved) {
        return;
      }


      try {

        const tasks =
          JSON.parse(saved);


        Object.keys(tasks)
          .forEach(id => {

            const element =
              document.getElementById(id);


            if (
              element &&
              tasks[id]
            ) {

              element.classList.add(
                "done"
              );

            }

          });

      } catch (error) {

        console.error(
          "Task loading error:",
          error
        );

      }

    }


    /* =========================================
       VOICE INPUT
    ========================================== */

    function startVoice() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        showToast(
          "Voice input isn't supported here."
        );

        return;
      }


      const recognition =
        new SpeechRecognition();


      recognition.lang =
        "bn-BD";


      recognition.interimResults =
        false;


      recognition.continuous =
        false;


      document
        .getElementById("status")
        .innerText =
          "NOVA is listening...";


      showToast(
        "Listening..."
      );


      recognition.onresult =
        function(event) {

          const text =
            event
              .results[0][0]
              .transcript;


          const input =
            document.getElementById(
              "prompt"
            );


          input.value =
            text;


          autoResize(input);


          document
            .getElementById("status")
            .innerText =
              "Got it. Press Ask NOVA.";

        };


      recognition.onerror =
        function(event) {

          console.error(
            "Voice error:",
            event
          );


          showToast(
            "Voice input stopped."
          );


          document
            .getElementById("status")
            .innerText =
              "NOVA is ready.";

        };


      recognition.onend =
        function() {

          const status =
            document.getElementById(
              "status"
            );


          if (
            status &&
            status.innerText ===
              "NOVA is listening..."
          ) {

            status.innerText =
              "NOVA is ready.";

          }

        };


      try {

        recognition.start();

      } catch (error) {

        console.error(
          "Voice start error:",
          error
        );

        showToast(
          "Could not start voice input."
        );

      }

    }


    /* =========================================
       AUTO RESIZE TEXTAREA
    ========================================== */

    function autoResize(element) {

      if (!element) {
        return;
      }


      element.style.height =
        "auto";


      element.style.height =
        Math.min(
          element.scrollHeight,
          180
        ) + "px";

    }


    /* =========================================
       ENTER TO SEND
    ========================================== */

    document
      .getElementById("prompt")
      .addEventListener(
        "keydown",
        function(event) {

          /*
            Enter = send
            Shift + Enter = new line
          */

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            askNova();

          }

        }
      );


    /* =========================================
       BOTTOM NAV
    ========================================== */

    function navClick(
      name,
      clickedButton
    ) {

      document
        .querySelectorAll(
          ".nav-btn"
        )
        .forEach(button => {

          button.classList.remove(
            "active"
          );

        });


      if (clickedButton) {

        clickedButton.classList.add(
          "active"
        );

      }


      /*
        These sections will become
        real screens in future versions.
      */

      if (name === "Home") {

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

        showToast(
          "Home"
        );

        return;
      }


      if (name === "Mind") {

        showToast(
          "Mind space coming next."
        );

        return;
      }


      if (name === "Learn") {

        setMode("LEARN");

        showToast(
          "LEARN mode ready."
        );

        return;
      }


      if (name === "Activity") {

        showToast(
          "Activity space coming next."
        );

        return;
      }

    }


    /* =========================================
       TOAST
    ========================================== */

    let toastTimer = null;


    function showToast(message) {

      const toast =
        document.getElementById(
          "toast"
        );


      if (!toast) {
        return;
      }


      toast.innerText =
        message;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          function() {

            toast.classList.remove(
              "show"
            );

          },
          1800
        );

    }


    /* =========================================
       INITIALIZE
    ========================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadTasks();


        /*
          Restore saved NOVA mode.
        */

        const savedMode =
          localStorage.getItem(
            "nova_mode"
          ) || "ASK";


        setMode(
          savedMode
        );


        /*
          Keep textarea height correct.
        */

        const input =
          document.getElementById(
            "prompt"
          );


        if (input) {
          autoResize(input);
        }

      }
    );

  </script>

</body>
</html>
