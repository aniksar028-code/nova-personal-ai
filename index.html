<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090B0C">
  <meta name="description" content="NOVA — Your Second Mind">
  <title>NOVA — Your Second Mind</title>

  <style>
    :root {
      --bg: #090B0C;
      --surface: #111416;
      --surface-2: #171B1D;
      --border: rgba(255,255,255,.08);
      --text: #F3F5F2;
      --muted: #89918D;
      --accent: #C8FF4A;
      --accent-soft: rgba(200,255,74,.10);
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(200,255,74,.08), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 680px;
      min-height: 100vh;
      margin: auto;
      padding: 22px 18px 110px;
    }

    /* TOP BAR */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #090B0C;
      font-size: 17px;
      font-weight: 900;
      box-shadow: 0 0 25px rgba(200,255,74,.16);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .profile {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* HERO */

    .hero {
      margin-top: 48px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .hero h1 {
      max-width: 500px;
      font-size: clamp(36px, 10vw, 62px);
      line-height: .98;
      letter-spacing: -2.5px;
    }

    .hero p {
      margin-top: 16px;
      color: var(--muted);
      font-size: 15px;
    }

    /* ORB */

    .orb-area {
      display: flex;
      justify-content: center;
      margin: 35px 0 25px;
    }

    .orb {
      position: relative;
      width: 105px;
      height: 105px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 35% 30%, #eaffbd, var(--accent) 35%, #7ea52d 70%, #273114);
      box-shadow:
        0 0 40px rgba(200,255,74,.14),
        inset 0 0 25px rgba(255,255,255,.25);
      animation: float 4s ease-in-out infinite;
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      inset: -12px;
      border: 1px solid rgba(200,255,74,.12);
      border-radius: 50%;
      animation: pulse 3s ease-in-out infinite;
    }

    .orb::after {
      inset: -22px;
      opacity: .45;
      animation-delay: 1s;
    }

    .orb-core {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #090B0C;
      box-shadow: 0 0 18px rgba(255,255,255,.3);
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes pulse {
      0%,100% { transform: scale(.96); opacity: .25; }
      50% { transform: scale(1.04); opacity: .7; }
    }

    /* INPUT */

    .composer {
      background: rgba(17,20,22,.88);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 17px;
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
      backdrop-filter: blur(18px);
    }

    .composer textarea {
      width: 100%;
      min-height: 72px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
    }

    .composer textarea::placeholder {
      color: #626A66;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }

    .voice-btn {
      width: 43px;
      height: 43px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 17px;
    }

    .send-btn {
      height: 43px;
      padding: 0 19px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #090B0C;
      font-size: 13px;
      font-weight: 800;
    }

    /* MODES */

    .section {
      margin-top: 30px;
    }

    .section-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .mode {
      text-align: left;
      padding: 16px 13px;
      border-radius: 17px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: .2s ease;
    }

    .mode:active {
      transform: scale(.97);
    }

    .mode.active {
      border-color: rgba(200,255,74,.4);
      background: var(--accent-soft);
    }

    .mode-icon {
      font-size: 17px;
      margin-bottom: 12px;
    }

    .mode strong {
      display: block;
      font-size: 13px;
    }

    .mode span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 5px;
    }

    /* QUICK ACTIONS */

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .quick {
      padding: 16px;
      border-radius: 17px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-align: left;
    }

    .quick small {
      display: block;
      color: var(--muted);
      margin-top: 6px;
      font-size: 11px;
    }

    /* TODAY */

    .today {
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      background: var(--surface);
    }

    .task {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .task:last-child {
      border-bottom: 0;
    }

    .task-time {
      width: 45px;
      color: var(--muted);
      font-size: 11px;
    }

    .check {
      width: 23px;
      height: 23px;
      border-radius: 8px;
      border: 1px solid #39403D;
      background: transparent;
      color: transparent;
      display: grid;
      place-items: center;
      font-size: 12px;
    }

    .task.done .check {
      background: var(--accent);
      color: #090B0C;
      border-color: var(--accent);
    }

    .task-info {
      flex: 1;
    }

    .task-info strong {
      display: block;
      font-size: 13px;
    }

    .task-info span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 4px;
    }

    /* STATUS */

    .status {
      text-align: center;
      margin-top: 22px;
      color: #69716D;
      font-size: 11px;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 15px;
      transform: translateX(-50%);
      width: min(92%, 560px);
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 21px;
      background: rgba(17,20,22,.9);
      backdrop-filter: blur(20px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
      z-index: 50;
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 15px;
      padding: 10px 4px;
      font-size: 10px;
    }

    .nav-btn span {
      display: block;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .nav-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      transform: translate(-50%, 20px);
      background: #F3F5F2;
      color: #090B0C;
      padding: 11px 17px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 390px) {
      .hero h1 {
        font-size: 35px;
      }

      .orb {
        width: 90px;
        height: 90px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">N</div>
        <div class="brand-name">NOVA</div>
      </div>

      <button class="profile" onclick="showToast('Profile coming next')">
        A
      </button>
    </header>

    <section class="hero">
      <div class="eyebrow">Your Second Mind</div>
      <h1>What should we do?</h1>
      <p>Think. Learn. Do.</p>
    </section>

    <div class="orb-area">
      <div class="orb">
        <div class="orb-core"></div>
      </div>
    </div>

    <section class="composer">

      <textarea
        id="prompt"
        placeholder="Ask NOVA anything..."
        oninput="autoResize(this)"
      ></textarea>

      <div class="composer-bottom">

        <button class="voice-btn" onclick="startVoice()">
          🎙
        </button>

        <button class="send-btn" onclick="askNova()">
          Ask NOVA →
        </button>

      </div>

    </section>

    <section class="section">

      <div class="section-title">Mode</div>

      <div class="modes">

        <button class="mode active" id="askMode" onclick="setMode('ASK')">
          <div class="mode-icon">◉</div>
          <strong>ASK</strong>
          <span>Know anything</span>
        </button>

        <button class="mode" id="learnMode" onclick="setMode('LEARN')">
          <div class="mode-icon">◇</div>
          <strong>LEARN</strong>
          <span>Learn anything</span>
        </button>

        <button class="mode" id="doMode" onclick="setMode('DO')">
          <div class="mode-icon">→</div>
          <strong>DO</strong>
          <span>Get things done</span>
        </button>

      </div>

    </section>

    <section class="section">

      <div class="section-title">Quick Actions</div>

      <div class="quick-grid">

        <button class="quick" onclick="quickAction('Create a plan for today')">
          ✦ Plan my day
          <small>Organize your priorities</small>
        </button>

        <button class="quick" onclick="quickAction('Teach me something useful')">
          ◇ Teach me
          <small>Start a learning session</small>
        </button>

        <button class="quick" onclick="quickAction('Show me my tasks')">
          ✓ My tasks
          <small>See what needs doing</small>
        </button>

        <button class="quick" onclick="quickAction('Help me think')">
          ◎ Think with me
          <small>Work through an idea</small>
        </button>

      </div>

    </section>

    <section class="section">

      <div class="section-title">Today</div>

      <div class="today">

        <div class="task" id="task1">
          <div class="task-time">09:00</div>

          <button class="check" onclick="toggleTask('task1')">
            ✓
          </button>

          <div class="task-info">
            <strong>Study session</strong>
            <span>Focus block</span>
          </div>
        </div>

        <div class="task" id="task2">
          <div class="task-time">17:00</div>

          <button class="check" onclick="toggleTask('task2')">
            ✓
          </button>

          <div class="task-info">
            <strong>Workout</strong>
            <span>Move your body</span>
          </div>
        </div>

        <div class="task" id="task3">
          <div class="task-time">21:00</div>

          <button class="check" onclick="toggleTask('task3')">
            ✓
          </button>

          <div class="task-info">
            <strong>Revision</strong>
            <span>Review today's learning</span>
          </div>
        </div>

      </div>

    </section>

    <div class="status" id="status">
      NOVA is ready.
    </div>

  </main>

  <nav class="bottom-nav">

    <button class="nav-btn active" onclick="navClick('Home')">
      <span>⌂</span>
      Home
    </button>

    <button class="nav-btn" onclick="navClick('Mind')">
      <span>◉</span>
      Mind
    </button>

    <button class="nav-btn" onclick="navClick('Learn')">
      <span>◇</span>
      Learn
    </button>

    <button class="nav-btn" onclick="navClick('Activity')">
      <span>≡</span>
      Activity
    </button>

  </nav>

  <div class="toast" id="toast"></div>
<script src="app.js"></script>
  <script>

    let currentMode = "ASK";

    function setMode(mode) {

      currentMode = mode;

      document.querySelectorAll(".mode")
        .forEach(button => button.classList.remove("active"));

      if (mode === "ASK")
        document.getElementById("askMode").classList.add("active");

      if (mode === "LEARN")
        document.getElementById("learnMode").classList.add("active");

      if (mode === "DO")
        document.getElementById("doMode").classList.add("active");

      document.getElementById("status").innerText =
        mode + " mode • NOVA is ready.";

      showToast(mode + " mode selected");
    }

    function askNova() {

      const input = document.getElementById("prompt");
      const text = input.value.trim();

      if (!text) {
        showToast("Tell NOVA what you need.");
        return;
      }

      document.getElementById("status").innerText =
        "NOVA received your request.";

      showToast("Request received");

      /*
        AI ENGINE WILL BE CONNECTED HERE.
        We intentionally keep API keys out of this file.
      */
    }

    function quickAction(text) {

      document.getElementById("prompt").value = text;

      document.getElementById("prompt").focus();

      autoResize(document.getElementById("prompt"));

      showToast("Ready to send");
    }

    function toggleTask(id) {

      const task = document.getElementById(id);

      task.classList.toggle("done");

      saveTasks();

      if (task.classList.contains("done")) {
        showToast("Nice. Task completed.");
      } else {
        showToast("Task reopened.");
      }
    }

    function saveTasks() {

      const tasks = {};

      ["task1", "task2", "task3"].forEach(id => {
        tasks[id] =
          document.getElementById(id).classList.contains("done");
      });

      localStorage.setItem(
        "nova_tasks",
        JSON.stringify(tasks)
      );
    }

    function loadTasks() {

      const saved =
        localStorage.getItem("nova_tasks");

      if (!saved) return;

      const tasks = JSON.parse(saved);

      Object.keys(tasks).forEach(id => {

        if (tasks[id]) {
          document.getElementById(id)
            .classList.add("done");
        }

      });
    }

    function startVoice() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        showToast("Voice input isn't supported here.");
        return;
      }

      const recognition = new SpeechRecognition();

      recognition.lang = "bn-BD";
      recognition.interimResults = false;

      document.getElementById("status").innerText =
        "NOVA is listening...";

      recognition.onresult = function(event) {

        const text =
          event.results[0][0].transcript;

        document.getElementById("prompt").value = text;

        autoResize(document.getElementById("prompt"));

        document.getElementById("status").innerText =
          "Got it. Press Ask NOVA.";

      };

      recognition.onerror = function() {
        showToast("Voice input stopped.");
      };

      recognition.start();
    }

    function autoResize(element) {

      element.style.height = "auto";

      element.style.height =
        Math.min(element.scrollHeight, 180) + "px";
    }

    function navClick(name) {

      showToast(name + " will open here.");

    }

    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.innerText = message;

      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

    loadTasks();

  </script>

</body>
</html>
