<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B0D0F">

  <title>NOVA — Your Second Mind</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0B0D0F;
      color: #F3F5F2;
      font-family: Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      max-width: 600px;
      margin: auto;
      padding: 28px 20px;
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #C8FF4A;
    }

    .hero {
      margin-top: 70px;
    }

    .hero h1 {
      font-size: 38px;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .hero p {
      color: #8B9490;
      font-size: 15px;
    }

    .input-box {
      margin-top: 35px;
      background: #121518;
      border: 1px solid #252A2D;
      border-radius: 22px;
      padding: 18px;
    }

    textarea {
      width: 100%;
      height: 90px;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: #F3F5F2;
      font-size: 16px;
      font-family: inherit;
    }

    textarea::placeholder {
      color: #68716D;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #C8FF4A;
      color: #0B0D0F;
    }

    .secondary {
      background: #1A1F21;
      color: #F3F5F2;
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 25px;
    }

    .mode {
      background: #121518;
      border: 1px solid #252A2D;
      color: #F3F5F2;
      padding: 18px 8px;
      border-radius: 16px;
      text-align: center;
    }

    .mode span {
      display: block;
      font-size: 12px;
      color: #8B9490;
      margin-top: 5px;
    }

    .status {
      margin-top: 30px;
      color: #68716D;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="brand">NOVA</div>

    <section class="hero">
      <h1>Your Second Mind.</h1>
      <p>Think. Learn. Do.</p>
    </section>

    <section class="input-box">
      <textarea id="prompt"
        placeholder="What should we do?"></textarea>

      <div class="actions">
        <button class="primary" onclick="askNova()">Ask NOVA</button>
        <button class="secondary" onclick="startVoice()">🎙 Voice</button>
      </div>
    </section>

    <section class="modes">

      <button class="mode" onclick="setMode('ASK')">
        ASK
        <span>Know anything</span>
      </button>

      <button class="mode" onclick="setMode('LEARN')">
        LEARN
        <span>Learn anything</span>
      </button>

      <button class="mode" onclick="setMode('DO')">
        DO
        <span>Get things done</span>
      </button>

    </section>

    <div class="status" id="status">
      NOVA is ready.
    </div>

  </main>

  <script>

    let currentMode = "ASK";

    function setMode(mode) {
      currentMode = mode;

      document.getElementById("status").innerText =
        "Mode: " + mode + " • NOVA is ready.";
    }

    function askNova() {

      const text = document.getElementById("prompt").value.trim();

      if (!text) {
        document.getElementById("status").innerText =
          "Tell NOVA what you need.";
        return;
      }

      document.getElementById("status").innerText =
        "NOVA received your request in " +
        currentMode + " mode.";
    }

    function startVoice() {

      if (!("webkitSpeechRecognition" in window)) {
        document.getElementById("status").innerText =
          "Voice input is not supported in this browser.";
        return;
      }

      const recognition = new webkitSpeechRecognition();

      recognition.lang = "bn-BD";
      recognition.interimResults = false;

      recognition.onstart = function() {
        document.getElementById("status").innerText =
          "NOVA is listening...";
      };

      recognition.onresult = function(event) {

        const text =
          event.results[0][0].transcript;

        document.getElementById("prompt").value = text;

        document.getElementById("status").innerText =
          "Got it. Press Ask NOVA.";
      };

      recognition.start();
    }

  </script>

</body>
</html>
